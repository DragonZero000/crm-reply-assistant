<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock-чат сделки</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #fff; --text: #1d2330; --muted: #6b7280; --border: #e2e5ea;
    --client: #eef1f5; --manager: #2f6fed; --manager-text: #fff; --accent: #2f6fed;
    --note: #fff8e1; --note-border: #f0d78c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --panel: #1c2027; --text: #e6e8eb; --muted: #9aa1ab; --border: #2c323b;
      --client: #262b33; --manager: #2f5fc4; --note: #2a2618; --note-border: #5c4f24;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 17px; margin: 0; }
  header label { color: var(--muted); }
  header input { width: 110px; margin-left: 6px; }
  .hint { color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 16px 20px; height: calc(100vh - 60px); }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; height: auto; } }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; display: flex; flex-direction: column; min-height: 0; }
  section h2 { font-size: 14px; margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--muted); font-weight: 600; }
  .scroll { flex: 1; overflow-y: auto; padding: 16px; min-height: 240px; }
  .msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; margin-bottom: 8px; white-space: pre-wrap; word-wrap: break-word; }
  .msg small { display: block; font-size: 11px; opacity: .7; margin-bottom: 2px; }
  .msg.client { background: var(--client); }
  .msg.manager { background: var(--manager); color: var(--manager-text); margin-left: auto; }
  .note { background: var(--note); border: 1px solid var(--note-border); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; white-space: pre-wrap; word-wrap: break-word; }
  .note time { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .empty { color: var(--muted); text-align: center; margin-top: 40px; }
  form { border-top: 1px solid var(--border); padding: 12px 16px; display: grid; gap: 8px; }
  .roles { display: flex; gap: 16px; }
  textarea { width: 100%; resize: vertical; min-height: 60px; font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  input[type=number] { font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  button { font: inherit; padding: 8px 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #status { color: var(--muted); font-size: 13px; }
  #status.error { color: #d9534f; }
</style>
</head>
<body>
<header>
  <h1>Mock-чат сделки AmoCRM</h1>
  <label>Сделка № <input id="lead" type="number" min="1" value="555"></label>
  <span class="hint">Сообщения уходят в <code>/webhooks/amo</code> в формате вебхука amoCRM. Клиенту ничего не отправляется.</span>
</header>
<main>
  <section>
    <h2>Диалог</h2>
    <div id="messages" class="scroll"></div>
    <form id="form">
      <div class="roles">
        <label><input type="radio" name="role" value="incoming" checked> Клиент</label>
        <label><input type="radio" name="role" value="outgoing"> Менеджер</label>
      </div>
      <textarea id="text" placeholder="Сообщение… (Enter — отправить, Shift+Enter — новая строка)"></textarea>
      <div class="row">
        <span id="status"></span>
        <button id="send" type="submit">Отправить</button>
      </div>
    </form>
  </section>
  <section>
    <h2>Примечания к сделке</h2>
    <div id="notes" class="scroll"></div>
  </section>
</main>
<script>
const WEBHOOK_TOKEN = __WEBHOOK_TOKEN__;
const $ = (id) => document.getElementById(id);
let expectedNotes = 0;  // сколько примечаний ждём после сообщения клиента
let pollTimer = null;

function leadId() { return $("lead").value.trim(); }

function newMessageId() {
  return (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(16).slice(2));
}

function setStatus(text, isError = false) {
  $("status").textContent = text;
  $("status").className = isError ? "error" : "";
}

function renderMessages(messages) {
  const box = $("messages");
  box.replaceChildren();
  if (!messages.length) {
    box.append(Object.assign(document.createElement("p"), { className: "empty", textContent: "Сообщений пока нет" }));
    return;
  }
  for (const m of messages) {
    const div = document.createElement("div");
    div.className = "msg " + m.role;
    const who = document.createElement("small");
    who.textContent = m.role === "client" ? "Клиент" : "Менеджер";
    div.append(who, document.createTextNode(m.text));
    box.append(div);
  }
  box.scrollTop = box.scrollHeight;
}

function renderNotes(notes) {
  const box = $("notes");
  box.replaceChildren();
  if (!notes.length) {
    box.append(Object.assign(document.createElement("p"), { className: "empty", textContent: "Примечаний пока нет" }));
    return;
  }
  for (const n of [...notes].reverse()) {  // новые сверху
    const div = document.createElement("div");
    div.className = "note";
    const time = document.createElement("time");
    time.textContent = new Date(n.created_at).toLocaleTimeString("ru-RU");
    div.append(time, document.createTextNode(n.text));
    box.append(div);
  }
}

async function refresh() {
  const id = leadId();
  if (!id) return;
  try {
    const response = await fetch(`/mock/leads/${encodeURIComponent(id)}`);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    renderMessages(data.messages);
    renderNotes(data.notes);
    if (expectedNotes && data.notes.length >= expectedNotes) {
      expectedNotes = 0;
      setStatus("Черновик готов");
    }
  } catch (err) {
    setStatus("Не удалось загрузить сделку: " + err.message, true);
  }
  clearTimeout(pollTimer);
  if (expectedNotes) pollTimer = setTimeout(refresh, 1500);
}

async function send(event) {
  event.preventDefault();
  const text = $("text").value.trim();
  const id = leadId();
  if (!text || !id) return;
  const type = document.querySelector("input[name=role]:checked").value;
  const prefix = "message[add][0]";
  const body = new URLSearchParams({
    "account[id]": "1", "account[subdomain]": "mock",
    [`${prefix}[id]`]: newMessageId(),
    [`${prefix}[chat_id]`]: `mock-chat-${id}`,
    [`${prefix}[talk_id]`]: id,
    [`${prefix}[contact_id]`]: "1",
    [`${prefix}[text]`]: text,
    [`${prefix}[created_at]`]: String(Math.floor(Date.now() / 1000)),
    [`${prefix}[type]`]: type,
    [`${prefix}[entity_type]`]: "lead",
    [`${prefix}[entity_id]`]: id,
    [`${prefix}[author][type]`]: type === "incoming" ? "external" : "user",
    [`${prefix}[author][name]`]: type === "incoming" ? "Клиент" : "Менеджер",
    [`${prefix}[origin]`]: "mock",
  });
  const url = "/webhooks/amo" + (WEBHOOK_TOKEN ? "?token=" + encodeURIComponent(WEBHOOK_TOKEN) : "");
  $("send").disabled = true;
  try {
    const notesBefore = $("notes").querySelectorAll(".note").length;
    const response = await fetch(url, { method: "POST", body });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const result = await response.json();
    $("text").value = "";
    if (result.queued) {
      expectedNotes = notesBefore + result.queued;
      setStatus("Генерируется черновик…");
    } else {
      setStatus(type === "outgoing" ? "Добавлено в историю, черновик не нужен" : "Сообщение не принято, см. лог сервиса");
    }
  } catch (err) {
    setStatus("Ошибка отправки: " + err.message, true);
  } finally {
    $("send").disabled = false;
  }
  refresh();
}

$("form").addEventListener("submit", send);
$("text").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});
$("lead").addEventListener("change", () => { expectedNotes = 0; setStatus(""); refresh(); });
refresh();
</script>
</body>
</html>
