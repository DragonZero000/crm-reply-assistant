schema: spec-driven

context: |
  Проект: сервис, который принимает обращение клиента, сверяется с короткой
  базой знаний и возвращает два блока: вежливый ответ клиенту и подсказку
  по допродажам для менеджера (диалог из AmoCRM).

  Стек:
  - Python 3.12, FastAPI, Pydantic v2, httpx
  - LLM: OpenAI-совместимый API (для тестов — LM Studio), ответ в структурированном JSON
  - Тесты: pytest
  - База знаний: knowledge_base.json (10-20 записей), без векторной БД

  Конвенции:
  - Секреты только из .env, в репозиторий не попадают
  - Все ответы API валидируются Pydantic-моделями
  - Формат ответа: {client_reply, manager_hint, used_kb_ids, needs_human,
    reason, upsell, compliance, kb_version}
    - reason: medical | no_kb_answer | complaint | other | null
      (null тогда и только тогда, когда needs_human=false)
    - upsell: [{product_id, name, price, pitch, why_now}]; товары только из
      related_ids карточек в used_kb_ids, name/price/pitch берутся из базы
    - compliance: {triggered, matches, original_reply}; при срабатывании
      стоп-листа client_reply заменяется шаблоном, needs_human=true

  Ограничения предметной области:
  - Ответ клиента вежливый и только по базе знаний
  - Если в базе нет ответа, честно сказать об этом и передать менеджеру
  - Никаких медицинских обещаний ("вылечит", "избавит от")

rules:
  proposal:
    - Указывай, что входит в прототип и что сознательно не делается
  specs:
    - Каждое требование сопровождай сценарием Given/When/Then
    - Обязательно покрывай случай "ответа нет в базе знаний"
  design:
    - Фиксируй решение "вся база в контексте, без RAG" и условия перехода на RAG
  tasks:
    - Задачи мелкие, каждая проверяема тестом или запросом curl