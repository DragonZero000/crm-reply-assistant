[project]
name = "core-reply-service"
version = "0.1.0"
description = "Черновик ответа клиенту и подсказка по допродажам по короткой базе знаний"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.60",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: запросы к реальной модели (запуск: pytest -m live)"]
addopts = "-m 'not live'"

[tool.uv]
package = false
